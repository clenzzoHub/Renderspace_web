<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RENDERSPACE | Premium Post-Studio Partner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root { --nav-height: 70px; --header-height: 60px; }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #0A0A0A; 
            color: #E0E0E0; 
            margin: 0; padding: 0; overflow: hidden; height: 100dvh; width: 100vw; position: fixed; 
        }
        .font-serif { font-family: 'Playfair Display', serif; }
        
        .app-container { 
            display: grid; 
            height: 100dvh; 
            grid-template-rows: var(--header-height) 1fr var(--nav-height); 
            position: relative;
            z-index: 10;
        }
        @media (min-width: 768px) { 
            .app-container { grid-template-rows: 1fr; grid-template-columns: 260px 1fr; } 
        }

        /* Background Illustration Layer */
        .illustration-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.04; /* Minimum opacity for premium look */
            overflow: hidden;
        }

        .content-area { overflow-y: auto; -webkit-overflow-scrolling: touch; position: relative; scroll-behavior: smooth; z-index: 20; }
        
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        .gold-gradient { background: linear-gradient(135deg, #D4AF37 0%, #F5E6AD 50%, #D4AF37 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .glass-card { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }

        .progress-bar-bg { height: 2px; width: 100%; background: rgba(255,255,255,0.05); border-radius: 4px; overflow: hidden; margin-top: 4px; }
        .progress-bar-fill { height: 100%; background: #D4AF37; transition: width 0.05s linear; }

        .mobile-nav { background: #080808; border-top: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: space-around; padding-bottom: env(safe-area-inset-bottom); z-index: 100; }
        
        .top-ad-banner { 
            background: linear-gradient(90deg, #1a0000 0%, #3d0000 100%); 
            border-radius: 1rem; 
            border: 1px solid rgba(212,175,55,0.15);
            max-width: 700px;
            margin: 0 auto 2rem;
        }

        .service-toggle { background: rgba(255,255,255,0.03); border-radius: 99px; padding: 4px; display: flex; gap: 4px; border: 1px solid rgba(255,255,255,0.05); }
        .toggle-btn { flex: 1; padding: 8px 12px; border-radius: 99px; font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; transition: all 0.3s; color: #666; }
        .toggle-btn.active { background: #D4AF37; color: black; box-shadow: 0 4px 12px rgba(212,175,55,0.2); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icon = ({ name, size = 18, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const IllustrationLayer = () => (
            <div className="illustration-bg">
                {/* Arch - Top Left */}
                <svg className="absolute -top-10 -left-10 w-64 h-64 text-white" viewBox="0 0 200 200" fill="none" stroke="currentColor" strokeWidth="1">
                    <path d="M40,180 Q40,40 100,40 Q160,40 160,180" />
                    <circle cx="40" cy="180" r="5" />
                    <circle cx="160" cy="180" r="5" />
                    <path d="M45,80 L35,70 M155,80 L165,70 M100,35 L100,45" />
                </svg>
                {/* Rings - Bottom Right */}
                <svg className="absolute -bottom-10 -right-10 w-80 h-80 text-white rotate-12" viewBox="0 0 200 200" fill="none" stroke="currentColor" strokeWidth="1">
                    <circle cx="80" cy="100" r="40" />
                    <circle cx="120" cy="100" r="40" />
                    <rect x="70" y="55" width="20" height="10" transform="rotate(-15 80 60)" />
                </svg>
                {/* Cake - Middle Left */}
                <svg className="absolute top-1/2 -left-20 w-48 h-48 text-white -translate-y-1/2 opacity-60" viewBox="0 0 200 200" fill="none" stroke="currentColor" strokeWidth="1">
                    <rect x="60" y="140" width="80" height="30" rx="2" />
                    <rect x="70" y="110" width="60" height="30" rx="2" />
                    <rect x="80" y="80" width="40" height="30" rx="2" />
                    <path d="M100,60 L100,80" />
                </svg>
                {/* Champagne - Top Right */}
                <svg className="absolute top-20 right-0 w-56 h-56 text-white opacity-40" viewBox="0 0 200 200" fill="none" stroke="currentColor" strokeWidth="1">
                    <path d="M80,180 L120,180 M100,180 L100,120 M70,60 L100,120 L130,60 Z" />
                    <circle cx="95" cy="40" r="3" />
                    <circle cx="110" cy="25" r="2" />
                    <circle cx="100" cy="10" r="4" />
                </svg>
            </div>
        );

        const App = () => {
            const [activeTab, setActiveTab] = useState('home');
            const [homeIdx, setHomeIdx] = useState(0);
            const [progress, setProgress] = useState(0);
            const [serviceType, setServiceType] = useState('video');
            const [contactMode, setContactMode] = useState(null);
            const [formData, setFormData] = useState({ studioName: '', contact: '', location: '', eventsCount: '' });
            
            const homeSections = [
                { label: 'Network', text: "Elite post-production specialists serving as your dedicated internal department." },
                { label: 'Impact', text: "Deliver cinematic wedding stories, high-end retouching, and premium print layouts." },
                { label: 'Flow', text: "Structured 15-day cycle. Scale up to 10 events monthly without overhead." }
            ];

            const serviceDetails = {
                video: {
                    desc: "Cinematic storytelling designed for high-end wedding studios. We focus on emotional narratives and color science.",
                    items: ["4K Documentary Edit", "2-3 Min Cinematic Highlights", "Instagram Reels (Vertical)", "Sync Audio Mastering", "LUTS & Color Grading", "Multi-cam Curation"]
                },
                photo: {
                    desc: "Editorial-grade image processing. We handle the heavy lifting of culling and high-end skin retouching.",
                    items: ["Smart AI Culling", "Skin & Body Retouching", "Frequency Separation", "Consistent Color Grading", "HDR Blending", "Batch Correction"]
                },
                ai: {
                    desc: "The future of post-production. Leveraging machine learning to speed up workflows without losing soul.",
                    items: ["AI Face Recognition Culling", "Noise Reduction (Low-light)", "AI Upscaling (Old Shoots)", "Generative Fill Backgrounds", "Smart Object Removal", "Voice-to-Text Subtitles"]
                }
            };

            useEffect(() => {
                if (activeTab !== 'home') return;
                const timer = setInterval(() => {
                    setProgress(p => {
                        if (p >= 100) { setHomeIdx(prev => (prev + 1) % homeSections.length); return 0; }
                        return p + 1;
                    });
                }, 50);
                return () => clearInterval(timer);
            }, [activeTab, homeIdx]);

            const handleWhatsApp = () => {
                const header = contactMode === 'sample' ? '*SAMPLE REQUESTED*' : '*PARTNER ENROLLMENT*';
                const locStr = formData.location ? `%0A*Location:* ${formData.location}` : '';
                const eventsStr = formData.eventsCount ? `%0A*Events/Mo:* ${formData.eventsCount}` : '';
                const msg = `${header}%0A*Studio:* ${formData.studioName}%0A*Contact:* ${formData.contact}${locStr}${eventsStr}`;
                window.open(`https://wa.me/919043858201?text=${msg}`);
            };

            return (
                <>
                    <IllustrationLayer />
                    <div className="app-container">
                        {/* Desktop Side Nav */}
                        <aside className="hidden md:flex flex-col bg-[#080808]/80 backdrop-blur-md border-r border-white/5 p-8 z-50">
                            <div className="mb-12">
                                <div className="text-xl font-extrabold text-white tracking-tighter">RENDER<span className="text-[#D4AF37]">SPACE</span></div>
                                <div className="text-[7px] tracking-[0.4em] text-gray-500 uppercase mt-1 font-bold">Partner Studio</div>
                            </div>
                            <nav className="flex flex-col gap-2">
                                {['home','services','pricing','contact'].map((t, i) => (
                                    <button key={t} onClick={() => {setActiveTab(t); setContactMode(null);}} className={`flex items-center gap-4 px-5 py-3 rounded-xl transition-all ${activeTab === t ? 'bg-[#800000] text-white shadow-lg' : 'text-gray-500 hover:text-white hover:bg-white/5'}`}>
                                        <Icon name={['home','layers','indian-rupee','message-circle'][i]} />
                                        <span className="text-[9px] font-black uppercase tracking-widest">{t}</span>
                                    </button>
                                ))}
                            </nav>
                        </aside>

                        {/* Mobile Header */}
                        <header className="md:hidden flex items-center justify-between px-6 bg-[#080808]/80 backdrop-blur-md border-b border-white/5">
                            <div className="text-lg font-black text-white tracking-tighter">RENDER<span className="text-[#D4AF37]">SPACE</span></div>
                        </header>

                        <main className="content-area">
                            {activeTab === 'home' && (
                                <div className="fade-in p-6 md:p-12 flex flex-col justify-center min-h-full">
                                    <div className="top-ad-banner px-6 py-4 flex items-center justify-between gap-6 shadow-2xl relative z-30">
                                        <div className="flex-1">
                                            <div className="text-[#D4AF37] text-[8px] font-black uppercase tracking-widest mb-1">Limited Availability</div>
                                            <h4 className="text-sm md:text-lg font-serif font-bold text-white leading-tight">Scale Your Studio To <span className="italic text-[#D4AF37]">Infinity</span>.</h4>
                                        </div>
                                        <button onClick={()=>setActiveTab('pricing')} className="shrink-0 bg-white text-black px-5 py-2 rounded-full text-[9px] font-black uppercase tracking-tighter whitespace-nowrap">Explore Plans</button>
                                    </div>

                                    <div className="text-center max-w-4xl mx-auto relative z-30">
                                        <h1 className="text-3xl md:text-7xl font-serif font-bold text-white mb-6 leading-none">Hire a team at <br/><span className="gold-gradient italic font-normal">the cost of an editor</span>.</h1>
                                        <p className="text-gray-400 text-sm md:text-xl font-light mb-10 h-16 flex items-center justify-center italic opacity-80">"{homeSections[homeIdx].text}"</p>
                                        
                                        <div className="flex gap-4 md:gap-8 max-w-sm mx-auto">
                                            {homeSections.map((s, idx) => (
                                                <div key={idx} className="flex-grow">
                                                    <div className={`text-[8px] font-black uppercase tracking-widest mb-1 ${idx === homeIdx ? 'text-[#D4AF37]' : 'text-gray-700'}`}>{s.label}</div>
                                                    <div className="progress-bar-bg">
                                                        <div className="progress-bar-fill" style={{ width: idx === homeIdx ? `${progress}%` : idx < homeIdx ? '100%' : '0%' }}></div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'services' && (
                                <div className="fade-in py-12 relative z-30">
                                    <div className="px-6 md:px-12 mb-12 text-center">
                                        <h2 className="text-4xl font-serif font-bold italic mb-2">Our <span className="text-[#D4AF37]">Ecosystem</span></h2>
                                        <p className="text-gray-600 text-[9px] uppercase tracking-widest font-black">Post-Production Mastery for High-End Studios</p>
                                    </div>

                                    <div className="px-6 md:px-12 max-w-2xl mx-auto mb-10">
                                        <div className="service-toggle">
                                            {['video', 'photo', 'ai'].map(type => (
                                                <button 
                                                    key={type} 
                                                    onClick={() => setServiceType(type)}
                                                    className={`toggle-btn ${serviceType === type ? 'active' : ''}`}
                                                >
                                                    {type}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="px-6 md:px-12 max-w-4xl mx-auto">
                                        <div className="glass-card p-8 rounded-[2rem] border-white/5 animate-in fade-in zoom-in duration-300">
                                            <div className="flex flex-col md:flex-row gap-8">
                                                <div className="md:w-1/2">
                                                    <div className="text-[#D4AF37] mb-4">
                                                        <Icon name={serviceType === 'video' ? 'video' : serviceType === 'photo' ? 'camera' : 'cpu'} size={32}/>
                                                    </div>
                                                    <h3 className="text-2xl font-serif font-bold italic text-white mb-4 uppercase">{serviceType} Solutions</h3>
                                                    <p className="text-xs text-gray-500 leading-relaxed mb-6">{serviceDetails[serviceType].desc}</p>
                                                </div>
                                                <div className="md:w-1/2 bg-white/5 rounded-2xl p-6">
                                                    <h4 className="text-[9px] font-black text-white uppercase tracking-widest mb-4 border-b border-white/10 pb-2">Technical Stack</h4>
                                                    <div className="grid grid-cols-1 gap-2">
                                                        {serviceDetails[serviceType].items.map((item, i) => (
                                                            <div key={i} className="flex items-center gap-3 text-[10px] text-gray-400">
                                                                <div className="w-1.5 h-1.5 rounded-full bg-[#D4AF37]"></div>
                                                                {item}
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'pricing' && (
                                <div className="fade-in p-6 md:p-12 overflow-y-auto h-full relative z-30">
                                    <div className="text-center mb-8">
                                        <h2 className="text-2xl md:text-4xl font-serif font-bold italic mb-1">Partner <span className="text-[#D4AF37]">Packages</span></h2>
                                        <p className="text-[8px] text-gray-600 uppercase tracking-widest font-black">All Monthly Plans Capped at 10 Events</p>
                                    </div>

                                    <div className="grid lg:grid-cols-3 gap-6 max-w-6xl mx-auto items-stretch pb-20">
                                        <div className="glass-card p-6 rounded-[2rem] flex flex-col border-[#D4AF37]/10">
                                            <div className="text-[8px] font-black text-[#D4AF37] uppercase mb-1">Professional Choice</div>
                                            <h3 className="text-lg font-bold text-white mb-1">Video Editing Partner</h3>
                                            <div className="text-2xl font-black text-white mb-4">₹30,000<span className="text-[10px] text-gray-500 font-normal"> /mo</span></div>
                                            <div className="bg-white/5 p-3 rounded-lg mb-4">
                                                <div className="text-[8px] font-bold text-gray-400 uppercase mb-2">Per Event (Limit: 10/Mo)</div>
                                                <div className="space-y-1.5">
                                                    {['Reels x 2','Highlights x 1','Full Documentary x 1','Color Correction','Revisions x 2','Pendrive Files'].map(f => (
                                                        <div key={f} className="text-[9px] text-gray-300 flex items-center gap-2"><Icon name="check" size={10} className="text-[#D4AF37]"/>{f}</div>
                                                    ))}
                                                </div>
                                            </div>
                                            <button onClick={()=>{setActiveTab('contact'); setContactMode('partner');}} className="mt-auto w-full py-3 rounded-lg bg-[#800000] text-white text-[9px] font-black uppercase tracking-widest">Select Plan</button>
                                        </div>

                                        <div className="glass-card p-6 rounded-[2rem] flex flex-col border-white/10 bg-white/5 relative shadow-xl">
                                            <div className="absolute top-4 right-4 text-[#D4AF37]"><Icon name="star" size={14}/></div>
                                            <div className="text-[8px] font-black text-[#800000] uppercase mb-1">Full Studio Sync</div>
                                            <h3 className="text-lg font-bold text-white mb-1">Video + Photo Partner</h3>
                                            <div className="text-2xl font-black text-[#D4AF37] mb-4">₹45,000<span className="text-[10px] text-gray-500 font-normal"> /mo</span></div>
                                            <div className="bg-white/5 p-3 rounded-lg mb-4">
                                                <div className="text-[8px] font-bold text-gray-400 uppercase mb-2">Per Event (Limit: 10/Mo)</div>
                                                <div className="grid grid-cols-2 gap-x-4 gap-y-1.5">
                                                    {['Everything in Video','Photo Editing','Mid Frames x 2','Album Layout','Grading','Retouch','Revisions x 2','Pendrive'].map(f => (
                                                        <div key={f} className="text-[9px] text-gray-300 flex items-center gap-1.5"><Icon name="plus" size={10} className="text-[#800000]"/>{f}</div>
                                                    ))}
                                                </div>
                                            </div>
                                            <button onClick={()=>{setActiveTab('contact'); setContactMode('partner');}} className="mt-auto w-full py-3 rounded-lg bg-white text-black text-[9px] font-black uppercase tracking-widest">Select Plan</button>
                                        </div>

                                        <div className="glass-card p-6 rounded-[2rem] flex flex-col border-white/5">
                                            <div className="text-[8px] font-black text-gray-500 uppercase mb-1">Deliverable Set</div>
                                            <h3 className="text-lg font-bold text-white mb-1">Basic Print Combo</h3>
                                            <div className="text-2xl font-black text-white mb-4">₹15,000<span className="text-[10px] text-gray-500 font-normal"> /pkg</span></div>
                                            <div className="bg-white/5 p-3 rounded-lg mb-4">
                                                <div className="text-[8px] font-bold text-gray-400 uppercase mb-2">Included Per Event</div>
                                                <div className="space-y-1.5">
                                                    {['Album (60pg Custom Finish)','Frames x 2','Calendar x 1','Magazine x 1','Mug x 2'].map(f => (
                                                        <div key={f} className="text-[9px] text-gray-300 flex items-center gap-2"><Icon name="package" size={10} className="text-gray-500"/>{f}</div>
                                                    ))}
                                                </div>
                                            </div>
                                            <button onClick={()=>{setActiveTab('contact'); setContactMode('sample');}} className="mt-auto w-full py-3 rounded-lg border border-white/10 text-white text-[9px] font-black uppercase tracking-widest hover:bg-white/5">Get Quote</button>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'contact' && (
                                <div className="fade-in p-6 md:p-12 flex items-center justify-center min-h-full relative z-30">
                                    {!contactMode ? (
                                        <div className="grid md:grid-cols-2 gap-4 max-w-2xl w-full">
                                            <button onClick={() => setContactMode('sample')} className="glass-card p-8 rounded-3xl text-left hover:bg-white/5 transition-all group">
                                                <Icon name="image" size={32} className="text-[#D4AF37] mb-4" />
                                                <h3 className="text-xl font-serif font-bold italic mb-1">Samples.</h3>
                                                <p className="text-gray-600 text-[9px] uppercase tracking-widest">Review Our Benchmark.</p>
                                            </button>
                                            <button onClick={() => setContactMode('partner')} className="glass-card p-8 rounded-3xl text-left hover:bg-[#800000]/10 transition-all group">
                                                <Icon name="zap" size={32} className="text-[#800000] mb-4" />
                                                <h3 className="text-xl font-serif font-bold italic mb-1">Enrol.</h3>
                                                <p className="text-gray-600 text-[9px] uppercase tracking-widest">Start Onboarding.</p>
                                            </button>
                                        </div>
                                    ) : (
                                        <div className="max-w-md w-full glass-card p-8 rounded-3xl relative">
                                            <button onClick={()=>setContactMode(null)} className="absolute top-6 right-6 text-gray-600"><Icon name="x"/></button>
                                            <h2 className="text-2xl font-serif font-bold italic mb-6">{contactMode==='sample'?'Sample Data':'Partner Data'}</h2>
                                            <div className="space-y-3">
                                                <input placeholder="STUDIO NAME" className="w-full bg-white/5 border border-white/5 rounded-lg px-4 py-3 text-[10px] text-white uppercase outline-none focus:border-[#D4AF37]" onChange={e=>setFormData({...formData, studioName:e.target.value})}/>
                                                <input placeholder="WHATSAPP NO" className="w-full bg-white/5 border border-white/5 rounded-lg px-4 py-3 text-[10px] text-white uppercase outline-none focus:border-[#D4AF37]" onChange={e=>setFormData({...formData, contact:e.target.value})}/>
                                                {contactMode === 'partner' && (
                                                    <>
                                                        <input placeholder="LOCATION" className="w-full bg-white/5 border border-white/5 rounded-lg px-4 py-3 text-[10px] text-white uppercase outline-none focus:border-[#D4AF37]" onChange={e=>setFormData({...formData, location:e.target.value})}/>
                                                        <input placeholder="EVENTS PER MONTH" className="w-full bg-white/5 border border-white/5 rounded-lg px-4 py-3 text-[10px] text-white uppercase outline-none focus:border-[#D4AF37]" onChange={e=>setFormData({...formData, eventsCount:e.target.value})}/>
                                                    </>
                                                )}
                                                <button className="w-full bg-white text-black py-4 rounded-lg font-black text-[10px] uppercase tracking-widest flex items-center justify-center gap-2 mt-4" onClick={handleWhatsApp}>Connect via WhatsApp</button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}
                        </main>

                        <nav className="md:hidden mobile-nav">
                            {['home', 'layers', 'indian-rupee', 'message-circle'].map((icon, idx) => {
                                const tabs = ['home', 'services', 'pricing', 'contact'];
                                const isActive = activeTab === tabs[idx];
                                return (
                                    <button key={idx} onClick={() => {setActiveTab(tabs[idx]); setContactMode(null);}} className={`flex flex-col items-center gap-1 p-2 ${isActive ? 'text-[#D4AF37]' : 'text-gray-600'}`}>
                                        <Icon name={icon} size={20} />
                                        <span className="text-[8px] font-black uppercase">{tabs[idx]}</span>
                                    </button>
                                );
                            })}
                        </nav>
                    </div>
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
